<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>chat</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
	<link rel="stylesheet" href="../assets/css/chat.css">
</head>

<body>
	<h1>聊天室來啦</h1>
	<h2 id="username" class="username"></h2>
	<h3>你的課程有:</h3>
	<div class="class-list"></div>

	<div class="chat-place"></div>
	<div class="send-place mt-4">
		<input class="chat-message" placeholder="輸入訊息"></input>
		<button type="button" class="send-button">送出</button>
	</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"
	crossorigin="anonymous"></script>
<script>

	//not concern for websocket
	const input = document.querySelector(".chat-message");
	const username = document.querySelector(".username");

	const sendbutton = document.querySelector(".send-button");
	const chatplace = document.querySelector(".chat-place");
	const classlist = document.querySelector(".class-list");

	const courselink = document.querySelector(".course-link");


	let loginUser = null;//提前宣告，載入資料後，要把會員資料儲存在這裡
	let currentCourseId = null;
	let recentchats = null; //add

	// console.log(loginUser);

	//不可用相對路徑
	const ws = new WebSocket("ws://localhost:8080/meow-gym/chat");
	//ws.onopen = () => ws.send("Hello from browser!");

	ws.addEventListener("open", function () {
		ws.send("Hello from browser!");
	})

	//把匿名函式指派給 ws 的 onmessage 屬性
	//ws.onmessage = function(e){
	//console.log("Server:", e.data);
	//};

	//也可以寫成
	ws.addEventListener("message", function (e) {
		console.log("Server:", e.data);
		//chatplace.innerText = e.data; //????

		//add 
		// 發出 fetch 請求抓聊天紀錄
		// fetch(`/meow-gym/chat/getchat?courseId=${currentCourseId}`)
		// 	.then(resp => resp.json())
		// 	.then(body => {
		// 		console.log(body);
		// 		chatplace.innerHTML = ""; // 清空輸入過的內容
		// 		console.log(body.chats);

		// 		// 假設 body 是聊天紀錄陣列
		// 		body.chats.forEach(chat => {
		// 			chatplace.innerHTML += `
		//             <div class="border p-2 mb-2">
		//               <strong>${chat.name}</strong>：${chat.content}<br>
		//               <small>${chat.createdAt}</small>
		//             </div>`;
		// 		});
		// 	}).catch(err => console.error("載入聊天紀錄錯誤:", err));
		//add end

		recentchats.forEach(chat => {
			chatplace.innerHTML += `
		            <div class="border p-2 mb-2">
		              <strong>${chat.name}</strong>：${chat.content}<br>
		              <small>${chat.createdAt}</small>
		            </div>`;
		});

		// chatplace.innerHTML += `
		// 	    <div class="border p-2 mb-2">${e.data}</div>`;

		
	});

	ws.addEventListener('close', e => alert('連線已關閉'));
	ws.addEventListener('error', e => alert('連線發生錯誤'));

	//載入頁面就開始從後端servlet抓資料
	//路徑要搞清楚!!


	//取得login資料
	fetch('/meow-gym/user/info', {
		method: 'GET'
	}).then(resp => resp.json())
		.then(body => {
			loginUser = body.loginUser;
			console.log(loginUser); //代表
			username.innerText = `${loginUser.name}，你好！`;
		});


	//取得該user所有的courseId >> 搜尋session_users表格 >> 待改
	fetch('/meow-gym/chat/getusercourseid', {
		method: 'GET'
	}).then(resp => resp.json())
		.then(body => {
			console.log(body);
			console.log(body.usercourseid[0].courseId);
			console.log(body.usercourseid.length);

			//新增多種課程......
			for (let i = 0; i < body.usercourseid.length; i++) {
				console.log(body.usercourseid[i].courseId);
				//classlist.innerHTML += `<a href="getchat?courseId=${body.usercourseid[i].courseId}" class="m-4 px-4 text-center border">課程${body.usercourseid[i].courseId}</a>`;
				classlist.innerHTML += `
			    <a href="#" data-courseid="${body.usercourseid[i].courseId}" 
			       class="m-4 px-4 text-center border course-link">
			       課程編號 ${body.usercourseid[i].courseId}
			    </a>`;
			}

		});

	classlist.addEventListener("click", function (e) {
		if (e.target.classList.contains("course-link")) {
			e.preventDefault(); // 阻止 a 連結的跳轉

			const courseId = e.target.dataset.courseid;
			currentCourseId = Number(courseId); // [CHANGED] 更新目前選擇的課程 ID	
			console.log("載入課程:", courseId);

			// 發出 fetch 請求抓聊天紀錄
			fetch(`/meow-gym/chat/getchat?courseId=${courseId}`)
				.then(resp => resp.json())
				.then(body => {
					console.log(body);
					chatplace.innerHTML = ""; // 清空輸入過的內容
					console.log(body.chats);

					recentchats = body.chats; //將取出的陣列新增到全域變數

					// 假設 body 是聊天紀錄陣列
					body.chats.forEach(chat => {
						chatplace.innerHTML += `
		            <div class="border p-2 mb-2">
		              <strong>${chat.name}</strong>：${chat.content}<br>
		              <small>${chat.createdAt}</small>
		            </div>`;
					});
				}).catch(err => console.error("載入聊天紀錄錯誤:", err));
		}
	});

	console.log(currentCourseId); //undefined

	sendbutton.addEventListener("click", function () {
		ws.send(input.value);//改成下面

		if (!loginUser) {
			alert('尚未登入，請重新登入');
			return;
		};
		if (!currentCourseId) { // [CHANGED] 避免未選課程就送
			alert('請先選擇一個課程');
			return;
		}
		const text = input.value.trim();
		if (!text) {
			alert('請輸入訊息');
			return;
		}

		//add
		// 立刻把這則訊息加到畫面最後（不用等後端回應）
		// const now = new Date().toLocaleString();
		chatplace.innerHTML += `
			<div class="border p-2 mb-2">
				<strong>${loginUser.name}</strong>：${input.value}<br>
			</div>`;
		//add end


		//send the message to the controller
		fetch('sendchat', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({
				//這四個欄位是準備送到後端的「留言資料」。而每一個欄位的值應該從哪裡來，取決於你的後端資料結構和登入邏輯。
				//courseId: 10, //body.courseId >> Dao >> 資料庫
				courseId: currentCourseId,
				userId: loginUser.userId,//loginUser.userId, //body.userid? 3
				coachId: 1, //body.coachId >> Dao >> 資料庫
				content: input.value
			})
		}).then(resp => resp.json())
			.then(body => {
				console.log(body);
			});
	});

</script>

</html>
